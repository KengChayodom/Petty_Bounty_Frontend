name: petty_bounty
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

# --- State Management & Routing ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0

  # --- Backend & Network ---
  supabase_flutter: ^2.4.1
  http: ^1.2.1
  json_annotation: ^4.9.0

  # --- Push notifications (FCM — SRS-FR-12) ---
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  fluttertoast: ^8.2.8

  # --- UI & Utilities ---
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_map: ^6.1.0 # For the Map feature
  latlong2: ^0.9.0
  equatable: ^2.0.5

  mime: ^1.0.4
  http_parser: ^4.0.0  # สำหรับ MediaType
  uuid: ^4.4.0         # object names for direct-to-Storage photo uploads

  camera: ^0.10.5+9
  freezed_annotation: ^2.4.1
  geolocator: ^10.1.0

  cupertino_icons: ^1.0.8

  # --- Skeleton loading placeholders (no spinners anywhere in the app) ---
  skeletonizer: ^2.1.3
  flutter_map_marker_cluster: ^1.3.6
  intl: ^0.20.2
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.2
  riverpod_lint: ^2.3.10
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  change_app_package_name: ^1.5.0

flutter:

  uses-material-design: true
  
  assets: 
    - assets/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Petty Bounty Logo.png"


